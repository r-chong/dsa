name: Update review schedule

on:
  schedule:
    - cron: "17 5 * * *"
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-review-schedule
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-update: ${{ steps.activity.outputs.should-update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: activity
        name: Check for problem or mindsolve activity
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          activity_date="$(TZ=Europe/Paris date --date='yesterday' +%F)"
          if python3 scripts/update_review_schedule.py --check-activity "$activity_date"; then
            echo "should-update=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -eq 3 ]]; then
              echo "should-update=false" >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi

  update:
    needs: check
    if: needs.check.outputs.should-update == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run scheduler tests
        run: python -m unittest discover -s tests -p 'test_update_review_schedule.py'

      - name: Update schedule
        run: python scripts/update_review_schedule.py

      - name: Commit changed schedule
        shell: bash
        run: |
          if git diff --quiet -- review-schedule.csv; then
            echo "Schedule is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-schedule.csv
          git commit -m "chore: update review schedule"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
